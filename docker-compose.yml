services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: influrios
      POSTGRES_PASSWORD: influrios
      POSTGRES_DB: influrios
    ports:
      - "5432:5432"
    volumes:
      - influrios_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U influrios -d influrios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  influrios_pg:
