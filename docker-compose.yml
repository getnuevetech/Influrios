# Influrios — Docker Compose (Postgres + Next.js web)
# Start everything:  docker compose up -d --build
# Logs:              docker compose logs -f web
# Stop:              docker compose down
#
# Postgres + web are on an internal Docker network.
# Web is published only on 127.0.0.1:3000 for Nginx on the host.

services:
  postgres:
    image: postgres:16-alpine
    container_name: influrios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-influrios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-influrios}
      POSTGRES_DB: ${POSTGRES_DB:-influrios}
    ports:
      # Host access for local prisma/seed tooling only
      - "127.0.0.1:5432:5432"
    volumes:
      - influrios_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - influrios

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    container_name: influrios-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SHORT_LINK_HOST: ${NEXT_PUBLIC_SHORT_LINK_HOST:-inflr.me}
      SHORT_LINK_HOSTS: ${SHORT_LINK_HOSTS:-}
      # Inside Docker network, host is the service name "postgres" (not 127.0.0.1)
      DATABASE_URL: postgresql://${POSTGRES_USER:-influrios}:${POSTGRES_PASSWORD:-influrios}@postgres:5432/${POSTGRES_DB:-influrios}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SUPER_EMAIL: ${ADMIN_SUPER_EMAIL:-}
      ADMIN_SUPER_PASSWORD: ${ADMIN_SUPER_PASSWORD:-}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # JSON demo stores and banner uploads survive image rebuilds until each module moves to Postgres.
      - influrios_data:/app/data
      - influrios_uploads:/app/public/uploads
    networks:
      - influrios
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  influrios_pg:
    name: influrios_pg
  influrios_data:
    name: influrios_data
  influrios_uploads:
    name: influrios_uploads

networks:
  influrios:
    name: influrios
