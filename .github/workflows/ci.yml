name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: influrios
          POSTGRES_PASSWORD: influrios
          POSTGRES_DB: influrios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U influrios -d influrios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://influrios:influrios@localhost:5432/influrios
      SHADOW_DATABASE_URL: postgresql://influrios:influrios@localhost:5432/influrios_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:brand
      - name: Apply migrations and test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=influrios psql -h localhost -U influrios -d influrios -c "CREATE DATABASE influrios_shadow;"
          npx prisma migrate deploy
          npm test
          npm run check:migrations
      - name: Release evidence and authenticated journey
        env:
          AUTH_SECRET: ci-journey-secret
          ADMIN_SESSION_SECRET: ci-journey-secret
          JOURNEY_BASE_URL: http://127.0.0.1:3456
        run: |
          npx tsx scripts/release-evidence.ts
          npx next build
          rm -rf .next/standalone/public .next/standalone/.next/static
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          PORT=3456 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3456/login >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          npx tsx scripts/authz-journey.ts
          npx tsx scripts/report-collaboration-links.ts
          npx tsx scripts/report-signed-contracts.ts
