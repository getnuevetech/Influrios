# Influrios — Nginx reverse proxy for AWS Lightsail
# Install to: /etc/nginx/sites-available/influrios
# Enable: sudo ln -s /etc/nginx/sites-available/influrios /etc/nginx/sites-enabled/

upstream influrios_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # replace with your domain, e.g. influrios.com www.influrios.com

    client_max_body_size 20M;

    location /_next/static/ {
        proxy_pass http://influrios_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://influrios_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
